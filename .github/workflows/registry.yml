name: foundation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/registry.yml"
      - ".github/workflows/piao.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: foundation-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Lint
        run: ruff check .

  build-current-registry:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build registry from official sources
        run: python scripts/build_municipality_registry.py
      - name: Upload registry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: municipality-registry
          path: |
            data/processed/
            data/manifests/municipality_registry.json
          retention-days: 30

  build-lineage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build municipality lineage source layer
        run: python scripts/build_municipality_lineage.py
      - name: Upload lineage snapshot
        uses: actions/upload-artifact@v4
        with:
          name: municipality-lineage
          path: |
            data/lineage/
            data/manifests/municipality_lineage.json
          retention-days: 30

  piao-pilot:
    runs-on: ubuntu-latest
    needs: build-current-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Download current municipality registry
        uses: actions/download-artifact@v4
        with:
          name: municipality-registry
          path: data
      - name: Collect known Portale PIAO records
        run: |
          python scripts/collect_piao.py \
            --registry data/processed/municipalities.csv \
            --output-dir data/piao-pilot \
            --node-url https://piao.dfp.gov.it/node/32305 \
            --node-url https://piao.dfp.gov.it/node/32611 \
            --node-url https://piao.dfp.gov.it/node/23566
      - name: Upload PIAO pilot
        uses: actions/upload-artifact@v4
        with:
          name: piao-pilot
          path: data/piao-pilot/
          retention-days: 30
