name: foundation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/registry.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Lint
        run: ruff check .

  build-current-registry:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build registry from official sources
        run: python scripts/build_municipality_registry.py

      - name: Probe SITUAS municipality population
        run: python scripts/probe_population_source.py

      - name: Upload population probe
        uses: actions/upload-artifact@v4
        with:
          name: population-probe
          path: data/probes/situas_population_probe.json
          retention-days: 7

      - name: Locate latest validated PIAO snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow piao-bulk.yml \
            --status success \
            --limit 5 \
            --json databaseId,createdAt,headSha,conclusion,event,name

      - name: Upload registry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: municipality-registry
          path: |
            data/processed/
            data/manifests/municipality_registry.json
          retention-days: 30

  build-lineage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build municipality lineage source layer
        run: python scripts/build_municipality_lineage.py

      - name: Upload lineage snapshot
        uses: actions/upload-artifact@v4
        with:
          name: municipality-lineage
          path: |
            data/lineage/
            data/manifests/municipality_lineage.json
          retention-days: 30

