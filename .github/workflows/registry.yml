name: municipality registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/registry.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Lint
        run: ruff check .

  build-current-registry:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build registry from official sources
        run: python scripts/build_municipality_registry.py

      - name: Upload registry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: municipality-registry
          path: |
            data/processed/
            data/manifests/
          retention-days: 30
