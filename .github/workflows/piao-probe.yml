name: probe official PIAO portal

on:
  pull_request:
    paths:
      - "scripts/probe_piao_portal.py"
      - ".github/workflows/piao-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Discover public API endpoints used by the official frontend
        run: python scripts/probe_piao_portal.py
