name: inspect current PIAO frontend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/inspect_piao_portal.py"
      - ".github/workflows/piao-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Inspect public frontend
        run: python scripts/inspect_piao_portal.py
