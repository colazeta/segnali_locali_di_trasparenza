name: national PIAO collection

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: national-piao-collection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build current municipality registry
        run: python scripts/build_municipality_registry.py

      - name: Collect PIAO metadata from the official portal
        run: |
          python scripts/collect_piao.py \
            --registry data/processed/municipalities.csv \
            --output-dir data/piao \
            --require-index-discovery \
            --max-pages 2000 \
            --delay 0.2 \
            --timeout 12 \
            --retries 2

      - name: Upload national PIAO snapshot
        uses: actions/upload-artifact@v4
        with:
          name: piao-national-snapshot
          path: data/piao/
          retention-days: 90
