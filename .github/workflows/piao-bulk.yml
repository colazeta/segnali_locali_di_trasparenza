name: bulk national PIAO catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 1"
  push:
    branches:
      - piao-monitoring
    paths:
      - ".github/PIAO_BULK_RUN"

concurrency:
  group: bulk-national-piao-catalogue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test PIAO collector
        run: |
          pytest -q tests/test_piao.py
          ruff check src/segnali_locali_di_trasparenza/piao.py scripts/collect_piao_catalogue.py

      - name: Build municipality registry
        run: python scripts/build_municipality_registry.py

      - name: Collect complete official PIAO catalogue
        run: |
          python scripts/collect_piao_catalogue.py \
            --registry data/processed/municipalities.csv \
            --output-dir data/piao-bulk \
            --target-start-year 2026 \
            --delay 0.20 \
            --workers 4 \
            --timeout 20 \
            --retries 2

      - name: Upload bulk national snapshot
        uses: actions/upload-artifact@v4
        with:
          name: piao-bulk-national-snapshot
          path: data/piao-bulk/
          retention-days: 90
